---
version: "2"
linters:
  default: all
  disable:
    # deprecated in golangci-lint v2.13.0; exhaustruct_v5 replaces it and the
    # two double-report every literal when both are on.
    - exhaustruct
    - wsl
    - gomodguard
    - depguard
    - tagliatelle
    - nolintlint
    - varnamelen
    - ireturn
    - revive
    - lll
    - funcorder
    - noinlineerr
    - gomoddirectives
    - gosec
  settings:
    wrapcheck:
      ignore-package-globs:
        - github.com/labstack/echo/v5
